<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>betgirl — 비밀번호 재설정</title>
  <link rel="stylesheet" href="/assets/styles.css" />
  <script src="/assets/theme.js"></script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
<header class="site">
  <div class="wrap">
    <span class="brand"><span class="brand-sub">비밀번호 재설정</span></span>
    <nav><a href="/">경기</a><a href="/ledger">원장</a></nav>
  </div>
</header>
<main class="wrap">
  <section class="panel" style="max-width:460px;margin:48px auto 0">
    <div class="panel-head"><h2 id="title">비밀번호 재설정</h2></div>
    <div style="padding:20px">
      <div id="msg"></div>

      <!-- ① 재설정 메일 받기 -->
      <form id="requestForm" hidden>
        <div class="field">
          <label for="email">가입한 이메일</label>
          <input id="email" type="email" autocomplete="username" required />
        </div>
        <button type="submit" id="requestBtn" style="width:100%">재설정 메일 받기</button>
      </form>

      <!-- ② 메일 링크로 들어오면: 새 비밀번호 -->
      <form id="newPwForm" hidden>
        <div class="field">
          <label for="acct">계정</label>
          <input id="acct" type="email" autocomplete="username" readonly />
        </div>
        <div class="field">
          <label for="pw">새 비밀번호 (8자 이상)</label>
          <input id="pw" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <div class="field">
          <label for="pw2">새 비밀번호 확인</label>
          <input id="pw2" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <button type="submit" id="newPwBtn" style="width:100%">비밀번호 바꾸기</button>
      </form>

      <!-- ③ 완료 -->
      <div id="doneView" hidden>
        <div class="msg ok">새 비밀번호로 바꿨습니다. 로그인된 상태로 경기 화면으로 이동합니다…</div>
        <a href="/">지금 이동 →</a>
      </div>

      <div id="loading" class="empty">확인 중…</div>
    </div>
    <div class="note" id="note">
      가입한 이메일로 재설정 링크를 보냅니다. 링크는 한 번만 쓸 수 있고 시간이 지나면 만료되니,
      메일을 받으면 바로 눌러 주세요. 메일이 안 보이면 스팸함도 확인해 주세요.
    </div>
  </section>
</main>
<footer class="site"></footer>
<script src="/config.js"></script>
<script type="module" src="/assets/reset.js"></script>
</body>
</html>
