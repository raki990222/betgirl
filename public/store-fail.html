<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>betgirl — 결제 실패</title>
  <link rel="stylesheet" href="/assets/styles.css" />
  <script src="/assets/theme.js"></script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
<header class="site">
  <div class="wrap">
    <span class="brand"><span class="brand-sub">결제 실패</span></span>
    <nav><a href="/store">스토어</a><a href="/">경기</a></nav>
  </div>
</header>
<main class="wrap">
  <section class="panel" style="max-width:520px;margin:48px auto 0">
    <div class="panel-head"><h2>결제가 취소되었습니다</h2></div>
    <div style="padding:20px" id="body"><div class="empty">결제가 완료되지 않았습니다.</div></div>
    <div class="note"><a href="/store">← 다시 시도하기</a></div>
  </section>
</main>
<footer class="site"></footer>
<script src="/config.js"></script>
<script type="module">
  import { initNav } from '/assets/app.js';
  initNav('/store');
  const q = new URLSearchParams(location.search);
  const msg = q.get('message'), code = q.get('code');
  if (msg) document.querySelector('#body').innerHTML =
    `<div class="msg err">${msg}${code ? ` (${code})` : ''}</div>`;
</script>
</body>
</html>
