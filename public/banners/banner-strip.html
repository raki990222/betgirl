<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>betgirl 띠배너</title>
<style>
  :root { --accent:#e0316f; --text:#e8ecf5; --muted:#9aa2b5; --line:#2a3040; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:30px; overflow:hidden; }
  .strip {
    width:100%; height:30px; display:flex; align-items:center; gap:10px;
    padding:0 14px; cursor:pointer; text-decoration:none; color:var(--text);
    background:
      radial-gradient(300px 60px at 20% 50%, rgba(224,49,111,0.25), transparent 70%),
      linear-gradient(90deg,#0d1017,#12151d 60%,#0d1017);
    border-bottom:1px solid var(--line);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif;
    font-size:13px; white-space:nowrap;
  }
  .brand { display:flex; align-items:center; gap:6px; font-weight:800; letter-spacing:-0.02em; }
  .brand em { color:var(--accent); font-style:normal; }
  .brand svg { color:var(--accent); }
  .msg { color:var(--text); }
  .msg b { color:var(--accent); }
  .dot { color:var(--line); }
  .muted { color:var(--muted); }
  .cta {
    margin-left:auto; background:var(--accent); color:#fff; font-weight:800; font-size:11.5px;
    padding:4px 12px; border-radius:6px; white-space:nowrap;
  }
  @media (max-width:560px){ .muted{ display:none; } .dot{ display:none; } }
</style>
</head>
<body>
<a class="strip" href="https://betgirl.site" target="_blank" rel="noopener">
  <span class="brand">
    <svg width="16" height="16" viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2.4" opacity="0.4"/>
      <circle cx="16" cy="16" r="8" stroke="currentColor" stroke-width="2.4" opacity="0.65"/>
      <circle cx="16" cy="16" r="3" fill="currentColor"/>
    </svg>
    bet<em>girl</em>
  </span>
  <span class="dot">|</span>
  <span class="msg">KBO 예측을 <b>조작 불가능한 공개 원장</b>으로</span>
  <span class="dot muted">·</span>
  <span class="muted">믿지 말고 직접 검증하세요</span>
  <span class="cta">무료로 시작 →</span>
</a>
</body>
</html>
