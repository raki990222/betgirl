<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>betgirl 띠배너</title>
<style>
  :root { --accent:#e0316f; --text:#e8ecf5; --muted:#9aa2b5; --line:#2a3040; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:30px; overflow:hidden; }
  .strip {
    width:100%; height:30px; display:flex; align-items:center; gap:10px;
    padding:0 14px; cursor:pointer; text-decoration:none; color:var(--text);
    background:
      radial-gradient(300px 60px at 20% 50%, rgba(224,49,111,0.25), transparent 70%),
      linear-gradient(90deg,#0d1017,#12151d 60%,#0d1017);
    border-bottom:1px solid var(--line);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif;
    font-size:13px; white-space:nowrap;
  }
  .brand { display:flex; align-items:center; gap:6px; font-weight:800; letter-spacing:-0.02em; }
  .brand em { color:var(--accent); font-style:normal; }
  .brand svg { color:var(--accent); }
  .msg { color:var(--text); }
  .msg b { color:var(--accent); }
  .dot { color:var(--line); }
  .muted { color:var(--muted); }
  .cta {
    margin-left:auto; background:var(--accent); color:#fff; font-weight:800; font-size:11.5px;
    padding:4px 12px; border-radius:6px; white-space:nowrap;
  }
  @media (max-width:560px){ .muted{ display:none; } .dot{ display:none; } }
</style>
</head>
<body>
<a class="strip" href="https://betgirl.site" target="_blank" rel="noopener">
  <span class="brand">
    <svg width="34" height="22" viewBox="0 0 64 44" fill="none">
      <defs>
        <linearGradient id="sw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6aa6"/><stop offset="1" stop-color="#c81f5a"/></linearGradient>
        <radialGradient id="sc" cx="0.5" cy="0.36" r="0.75"><stop offset="0" stop-color="#2b3040"/><stop offset="1" stop-color="#0b0d13"/></radialGradient>
        <linearGradient id="sr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8dbd"/><stop offset="0.5" stop-color="#e0316f"/><stop offset="1" stop-color="#9c1244"/></linearGradient>
      </defs>
      <g fill="url(#sw)"><rect x="2" y="15.4" width="14" height="3" rx="1.5"/><rect x="1" y="20.3" width="16" height="3" rx="1.5"/><rect x="4" y="25.2" width="12" height="3" rx="1.5"/><rect x="48" y="15.4" width="14" height="3" rx="1.5"/><rect x="47" y="20.3" width="16" height="3" rx="1.5"/><rect x="48" y="25.2" width="12" height="3" rx="1.5"/></g>
      <circle cx="32" cy="22" r="15" fill="url(#sc)" stroke="url(#sr)" stroke-width="2.6"/>
      <circle cx="32" cy="22" r="9" fill="none" stroke="#ff8dbd" stroke-width="1.5" opacity="0.55"/>
      <circle cx="32" cy="22" r="4.1" fill="url(#sr)"/>
    </svg>
    bet<em>girl</em>
  </span>
  <span class="dot">|</span>
  <span class="msg">KBO 예측을 <b>조작 불가능한 공개 원장</b>으로</span>
  <span class="dot muted">·</span>
  <span class="muted">믿지 말고 직접 검증하세요</span>
  <span class="cta">무료로 시작 →</span>
</a>
</body>
</html>
