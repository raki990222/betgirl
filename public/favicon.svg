<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6aa6"/>
      <stop offset="1" stop-color="#c81f5a"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#2b3040"/>
      <stop offset="1" stop-color="#0b0d13"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8dbd"/>
      <stop offset="0.5" stop-color="#e0316f"/>
      <stop offset="1" stop-color="#9c1244"/>
    </linearGradient>
  </defs>

  <!-- 왼쪽 날개 -->
  <g fill="url(#wing)">
    <rect x="2"  y="25.4" width="15" height="3.4" rx="1.7"/>
    <rect x="1"  y="30.3" width="17" height="3.4" rx="1.7"/>
    <rect x="4"  y="35.2" width="13" height="3.4" rx="1.7"/>
  </g>
  <!-- 오른쪽 날개 (미러) -->
  <g fill="url(#wing)">
    <rect x="47" y="25.4" width="15" height="3.4" rx="1.7"/>
    <rect x="46" y="30.3" width="17" height="3.4" rx="1.7"/>
    <rect x="47" y="35.2" width="13" height="3.4" rx="1.7"/>
  </g>

  <!-- 배지 로델 -->
  <circle cx="32" cy="32" r="16" fill="url(#core)" stroke="url(#ring)" stroke-width="3"/>
  <!-- 과녁 -->
  <circle cx="32" cy="32" r="9.5" fill="none" stroke="#ff8dbd" stroke-width="1.6" opacity="0.55"/>
  <circle cx="32" cy="32" r="4.4" fill="url(#ring)"/>
  <!-- 상단 하이라이트 -->
  <path d="M22 24 a13 13 0 0 1 20 0" stroke="#ffffff" stroke-width="1.4" opacity="0.18" fill="none" stroke-linecap="round"/>
</svg>
